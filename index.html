<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>👕</text></svg>" type="image/svg+xml">
    <title>客衣收送紀錄-寒居酒店</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
        }
        @media print {
            .no-print { display: none; }
        }
        .loading{
            border:3px solid #f3f3f3;
            border-top:3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display:inline-block;
        }
        @keyframes spin {
            0% {transform:rotate(0deg);}
            100% {transform:rotate(360deg);}
        }
    </style>
</head>
<body class="bg-gray-50">
    
    <!-- Header -->
    <div class="bg-[#7A99AC] text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="https://miluku06.github.io/HB-housekeeping/" class="p-2 hover:bg-white/20 rounded-lg transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </a>
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                    <span class="text-[#7A99AC] font-bold text-lg">HB</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold">客衣收送紀錄</h1>
                    <p class="text-xs text-blue-100">Laundry Service</p>
                </div>
            </div>
            <button onclick="showForm()" class="no-print flex items-center gap-2 bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span class="hidden sm:inline">新增記錄</span>
            </button>
        </div>
    </div>

    <div id="app" class="min-h-screen p-4">
        <div class="max-w-7xl mx-auto">
            <!-- 標題區 -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                
                <!-- 服務說明 -->
                <div class="bg-blue-50 rounded-lg p-4 mb-6 text-sm">
                    <div class="space-y-2">
                        <div>
                            <span class="font-bold text-blue-600">＊洗衣服務</span>
                            <br><span class="text-gray-700 ml-2">中午12時前收件,當日下午8時前送回</span>
                            <br><span class="text-gray-700 ml-2">下午6時前收件,隔日中午11時前送回</span>
                        </div>
                        <div>
                            <span class="font-bold text-orange-600">＊快洗服務</span>
                            <br><span class="text-gray-700 ml-2">上午8時至下午4時前收件</span>
                            <br><span class="text-gray-700 ml-2">4小時內送回(另加費用50%)</span>
                        </div>
                        <div>
                            <span class="font-bold text-purple-600">＊快速整燙</span>
                            <br><span class="text-gray-700 ml-2">上午8時至下午4時前收件</span>
                            <br><span class="text-gray-700 ml-2">2小時內送回(另加費用50%)</span>
                        </div>
                    </div>
                </div>
                
                <div class="flex-1 relative">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="搜尋房號或對點人..."
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        oninput="renderTable()"
                    />
                    <svg class="absolute left-3 top-3 text-gray-400" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
            </div>

            <!-- 表單區 -->
            <div id="formSection" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden no-print">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800" id="formTitle">新增記錄</h2>
                    <button onclick="resetForm()" class="text-gray-500 hover:text-gray-700">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">收取日期 *</label>
                        <input type="date" id="pickupDate" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">房號 *</label>
                        <input type="text" id="roomNumber" placeholder="例:1001" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">收取時間</label>
                        <input type="time" id="pickupTime" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">收取對點人</label>
                        <input type="text" id="pickupStaff" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">送回日期</label>
                        <input type="date" id="returnDate" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">送回時間</label>
                        <input type="time" id="returnTime" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">掛(件數)</label>
                        <input type="number" id="hangCount" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">包(件數)</label>
                        <input type="number" id="packageCount" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">送回對點人</label>
                        <input type="text" id="returnStaff" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">回房時間</label>
                        <input type="time" id="returnToRoomTime" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                   <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">折扣(服務費另計)</label>
                        <select id="discount" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">請選擇折扣</option>
                            <option value="滿1千折300">滿1千折300</option>
                            <option value="滿2千折600">滿2千折600</option>
                            <option value="滿3千折900">滿3千折900</option>
                            <option value="滿4千折1200">滿4千折1200</option>
                            <option value="滿5千折1500">滿5千折1500</option>
                        </select>
                    </div>
                    <div class="md:col-span-3">
                        <label class="block text-sm font-medium text-gray-700 mb-1">備註</label>
                        <textarea id="notes" rows="3" placeholder="其他說明事項..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button onclick="saveRecord(event)" class="flex items-center gap-2 bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition-colors">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        儲存
                    </button>
                    <button onclick="resetForm()" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                        取消
                    </button>
                </div>
            </div>

            <!-- 月份篩選按鈕區 -->
            <div id="monthFilterSection" class="bg-white rounded-lg shadow-md p-4 mb-6 hidden">
                <div class="flex flex-wrap gap-2" id="monthButtons"></div>
            </div>

            <!-- 表格區 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-100 border-b">
                            <tr>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">收取日期</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">房號</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">收取時間</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">收取對點人</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">送回日期</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">掛/包</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">送回對點人</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700">回房時間</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-700 no-print">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="9" class="px-4 py-8 text-center text-gray-500">
                                    <div class="loading mx-auto mb-2"></div>
                                    <div>載入中...</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="recordCount" class="mt-4 text-center text-sm text-gray-600"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwcwIZ2LxPhOl9TcUPevH_5G8KYu9t4MDSHsFIMbA92mthKt-0mtBqIzUmYschruYuBjQ/exec';

        let records = [];
        let editingId = null;
        let selectedMonth = null;

        // 🔧 修正:加入超時處理的 fetch 函數
        async function fetchWithTimeout(url, options = {}, timeout = 30000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);
            
            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                return response;
            } catch (error) {
                clearTimeout(timeoutId);
                if (error.name === 'AbortError') {
                    throw new Error('請求超時,請檢查網路連線或稍後再試');
                }
                throw error;
            }
        }

        async function loadRecords() {
            try {
                console.log('🔄 開始載入資料...');
                console.log('📍 API URL:', SCRIPT_URL);
                
                const response = await fetchWithTimeout(SCRIPT_URL, {}, 30000);
                
                console.log('📥 Response status:', response.status);
                console.log('📥 Response headers:', Object.fromEntries(response.headers.entries()));
                
                if (!response.ok) {
                    throw new Error(`HTTP 錯誤! 狀態碼: ${response.status}`);
                }
                
                const textData = await response.text();
                console.log('📄 收到的原始資料:', textData.substring(0, 500));
                
                let data;
                try {
                    data = JSON.parse(textData);
                } catch (parseError) {
                    console.error('❌ JSON 解析失敗:', parseError);
                    throw new Error(`無法解析伺服器回應: ${parseError.message}`);
                }
                
                console.log('✅ 解析後的資料:', data);
                
                if (data.error) {
                    throw new Error(`伺服器錯誤: ${data.error}`);
                }
                
                if (!data || !Array.isArray(data)) {
                    console.warn('⚠️ 收到的資料不是陣列:', typeof data);
                    records = [];
                    renderTable();
                    return;
                }
                
                records = data.filter(r => r && r.id && r.id !== '');
                
                records.sort((a, b) => {
                    const dateA = new Date(a.pickupDate || '1970-01-01');
                    const dateB = new Date(b.pickupDate || '1970-01-01');
                    return dateB - dateA;
                });
                
                console.log('✅ 載入成功! 記錄數量:', records.length);
                console.log('📊 前 3 筆記錄:', records.slice(0, 3));
                
                initMonthFilter();
                renderTable();
                
            } catch (error) {
                console.error('❌ 載入資料失敗:', error);
                console.error('錯誤堆疊:', error.stack);
                
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="px-4 py-8 text-center">
                            <div class="text-red-500 font-bold mb-2">⚠️ 載入資料失敗</div>
                            <div class="text-sm text-gray-600 mb-3">${error.message}</div>
                            <div class="text-xs text-gray-500 space-y-1">
                                <p class="font-semibold">可能的原因:</p>
                                <p>1. Google Apps Script 部署 URL 不正確</p>
                                <p>2. Apps Script 權限未設定為「任何人」</p>
                                <p>3. Google Sheets 權限不足</p>
                                <p>4. 網路連線問題或請求超時</p>
                                <p class="mt-3 font-semibold">請按 F12 開啟開發者工具查看詳細錯誤</p>
                            </div>
                            <button 
                                onclick="loadRecords()" 
                                class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                            >
                                🔄 重新載入
                            </button>
                        </td>
                    </tr>
                `;
            }
        }

        async function saveToStorage(record, action = 'save') {
            try {
                console.log('💾 準備儲存:', action, record);
                
                const response = await fetchWithTimeout(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                    },
                    body: JSON.stringify({
                        action: action,
                        record: record,
                        id: record?.id
                    })
                }, 30000);
                
                if (!response.ok) {
                    throw new Error(`HTTP 錯誤! 狀態碼: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('✅ 儲存成功:', result);
                
                return true;
            } catch (error) {
                console.error('❌ 儲存失敗:', error);
                alert(`儲存失敗: ${error.message}\n\n請檢查網路連線或稍後再試`);
                return false;
            }
        }

        function showForm() {
            document.getElementById('formSection').classList.remove('hidden');
            document.getElementById('formTitle').textContent = '新增記錄';
            window.scrollTo({ top: 200, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('formTitle').textContent = '新增記錄';
            editingId = null;
            
            const fields = ['pickupDate', 'roomNumber', 'pickupTime', 'pickupStaff', 'returnDate', 
                          'returnTime', 'hangCount', 'packageCount', 'returnStaff', 
                          'returnToRoomTime', 'discount', 'notes'];
            fields.forEach(field => {
                document.getElementById(field).value = '';
            });
        }

        async function saveRecord(event) {
            const pickupDate = document.getElementById('pickupDate').value;
            const roomNumber = document.getElementById('roomNumber').value;

            if (!pickupDate || !roomNumber) {
                alert('請填寫收取日期和房號');
                return;
            }

            const record = {
                id: editingId || Date.now().toString(),
                pickupDate,
                roomNumber,
                pickupTime: document.getElementById('pickupTime').value,
                pickupStaff: document.getElementById('pickupStaff').value,
                returnDate: document.getElementById('returnDate').value,
                returnTime: document.getElementById('returnTime').value,
                hangCount: document.getElementById('hangCount').value,
                packageCount: document.getElementById('packageCount').value,
                returnStaff: document.getElementById('returnStaff').value,
                returnToRoomTime: document.getElementById('returnToRoomTime').value,
                discount: document.getElementById('discount').value,
                notes: document.getElementById('notes').value
            };

            const saveBtn = event.target.closest('button');
            const originalHTML = saveBtn.innerHTML;
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<div class="loading"></div><span class="ml-2">儲存中...</span>';

            const success = await saveToStorage(record, 'save');
            
            if (success) {
                if (editingId) {
                    const index = records.findIndex(r => r.id === editingId);
                    if (index !== -1) {
                        records[index] = record;
                    }
                } else {
                    records.unshift(record);
                }
                
                initMonthFilter();
                renderTable();
                resetForm();
                
                setTimeout(async () => {
                    console.log('🔄 重新載入資料以確保同步...');
                    await loadRecords();
                }, 2000);
            }
            
            saveBtn.disabled = false;
            saveBtn.innerHTML = originalHTML;
        }

        function editRecord(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            editingId = id;
            document.getElementById('formTitle').textContent = '編輯記錄';
            document.getElementById('formSection').classList.remove('hidden');

            document.getElementById('pickupDate').value = formatDate(record.pickupDate);
            document.getElementById('roomNumber').value = record.roomNumber;
            document.getElementById('pickupTime').value = formatTime(record.pickupTime);
            document.getElementById('pickupStaff').value = record.pickupStaff || '';
            document.getElementById('returnDate').value = formatDate(record.returnDate);
            document.getElementById('returnTime').value = formatTime(record.returnTime);
            document.getElementById('hangCount').value = record.hangCount || '';
            document.getElementById('packageCount').value = record.packageCount || '';
            document.getElementById('returnStaff').value = record.returnStaff || '';
            document.getElementById('returnToRoomTime').value = formatTime(record.returnToRoomTime);
            document.getElementById('discount').value = record.discount || '';
            document.getElementById('notes').value = record.notes || '';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteRecord(id) {
            if (!confirm('確定要刪除此記錄嗎?')) return;
            
            const success = await saveToStorage({id: id}, 'delete');
            
            if (success) {
                records = records.filter(r => r.id !== id);
                initMonthFilter();
                renderTable();
                
                setTimeout(async () => {
                    console.log('🔄 重新載入資料以確保同步...');
                    await loadRecords();
                }, 2000);
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                return dateStr;
            }
            
            try {
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return dateStr;
                
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            } catch (e) {
                return dateStr;
            }
        }

        function formatTime(timeStr) {
            if (!timeStr) return '';
            
            if (/^\d{2}:\d{2}$/.test(timeStr)) {
                return timeStr;
            }
            
            try {
                const date = new Date(timeStr);
                if (isNaN(date.getTime())) return timeStr;
                
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${hours}:${minutes}`;
            } catch (e) {
                return timeStr;
            }
        }

        // 🔧 修正:改進月份篩選邏輯,解決1月記錄無法顯示的問題
        function initMonthFilter() {
            console.log('🔍 初始化月份篩選器...');
            
            if (!records || records.length === 0) {
                console.log('⚠️ 沒有記錄,隱藏篩選器');
                document.getElementById('monthFilterSection').classList.add('hidden');
                selectedMonth = null;
                return;
            }
            
            const monthSet = new Set();
            records.forEach(record => {
                if (record.pickupDate) {
                    const date = new Date(record.pickupDate);
                    if (!isNaN(date.getTime())) {
                        const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                        monthSet.add(monthKey);
                        console.log(`📅 找到記錄月份: ${monthKey} (來自: ${record.pickupDate})`);
                    }
                }
            });

            const months = Array.from(monthSet).sort((a, b) => b.localeCompare(a));
            console.log('📅 所有月份:', months);

            // 🔧 修正:即使只有一個月份也顯示篩選器
            if (months.length === 0) {
                console.log('⚠️ 沒有有效的月份資料');
                document.getElementById('monthFilterSection').classList.add('hidden');
                selectedMonth = null;
                return;
            }

            // 🔧 如果當前沒有選中的月份,或選中的月份不在列表中,則選擇最新月份
            if (!selectedMonth || !months.includes(selectedMonth)) {
                const now = new Date();
                const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                selectedMonth = months.includes(currentMonth) ? currentMonth : months[0];
            }
            
            console.log('✅ 當前選擇月份:', selectedMonth);

            // 生成月份按鈕 (不包含「全部」按鈕)
            const monthButtons = document.getElementById('monthButtons');
            
            const monthButtonsHTML = months.map(month => {
                const [year, monthNum] = month.split('-');
                const isActive = month === selectedMonth;
                
                return `
                    <button 
                        onclick="selectMonth('${month}')"
                        class="px-4 py-2 rounded-lg transition-colors ${
                            isActive 
                                ? 'bg-blue-600 text-white' 
                                : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                        }"
                    >
                        ${year}年${monthNum}月
                    </button>
                `;
            }).join('');

            monthButtons.innerHTML = monthButtonsHTML;
            
            // 🔧 只要有月份就顯示篩選器
            if (months.length > 0) {
                document.getElementById('monthFilterSection').classList.remove('hidden');
            }
        }

        function selectMonth(month) {
            console.log('📅 選擇月份:', month || '全部');
            selectedMonth = month;
            initMonthFilter();
            renderTable();
        }

        function renderTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = records;
            
            // 🔧 修正:月份篩選邏輯
            if (selectedMonth) {
                console.log('🔍 開始篩選月份:', selectedMonth);
                filtered = filtered.filter(r => {
                    if (!r.pickupDate) {
                        console.log('⚠️ 記錄沒有 pickupDate:', r);
                        return false;
                    }
                    const date = new Date(r.pickupDate);
                    if (isNaN(date.getTime())) {
                        console.log('⚠️ 無效的日期:', r.pickupDate);
                        return false;
                    }
                    const recordMonth = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                    const match = recordMonth === selectedMonth;
                    console.log(`📊 記錄: ${r.pickupDate} -> ${recordMonth}, 符合 ${selectedMonth}? ${match}`);
                    return match;
                });
                console.log(`✅ 篩選後記錄數: ${filtered.length}`);
            }
            
            // 搜尋篩選
            if (searchTerm) {
                filtered = filtered.filter(r => 
                    (r.roomNumber && r.roomNumber.toString().toLowerCase().includes(searchTerm)) ||
                    (r.pickupStaff && r.pickupStaff.toString().toLowerCase().includes(searchTerm)) ||
                    (r.returnStaff && r.returnStaff.toString().toLowerCase().includes(searchTerm))
                );
            }

            const tbody = document.getElementById('tableBody');
            
            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="px-4 py-8 text-center text-gray-500">
                            ${records.length === 0 ? '暫無記錄,請新增第一筆資料' : '找不到符合條件的記錄'}
                        </td>
                    </tr>
                `;
                document.getElementById('recordCount').textContent = '';
                return;
            }

            tbody.innerHTML = filtered.map(record => {
                let itemsText = '';
                if (record.hangCount) itemsText += `掛${record.hangCount}`;
                if (record.hangCount && record.packageCount) itemsText += ' / ';
                if (record.packageCount) itemsText += `包${record.packageCount}`;

                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 text-sm">${formatDate(record.pickupDate)}</td>
                        <td class="px-4 py-3 text-sm font-medium">${record.roomNumber || ''}</td>
                        <td class="px-4 py-3 text-sm">${formatTime(record.pickupTime)}</td>
                        <td class="px-4 py-3 text-sm">${record.pickupStaff || ''}</td>
                        <td class="px-4 py-3 text-sm">${formatDate(record.returnDate)}</td>
                        <td class="px-4 py-3 text-sm">${itemsText}</td>
                        <td class="px-4 py-3 text-sm">${record.returnStaff || ''}</td>
                        <td class="px-4 py-3 text-sm">${formatTime(record.returnToRoomTime)}</td>
                        <td class="px-4 py-3 text-sm no-print">
                            <div class="flex gap-2">
                                <button onclick="editRecord('${record.id}')" class="text-blue-600 hover:text-blue-800">
                                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                    </svg>
                                </button>
                                <button onclick="deleteRecord('${record.id}')" class="text-red-600 hover:text-red-800">
                                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                    </svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            const filterInfo = selectedMonth ? ` (${selectedMonth.replace('-', '年')}月)` : '';
            document.getElementById('recordCount').textContent = `共 ${filtered.length} 筆記錄${filterInfo}`;
        }

        // 頁面載入時自動執行
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 頁面載入完成,開始初始化...');
            loadRecords();
        });
    </script>
</body>

</html>
